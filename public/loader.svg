<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="56" stroke="#8B7355" stroke-width="1.5" fill="none" opacity="0.3"/>
  <circle cx="60" cy="60" r="52" stroke="#8B7355" stroke-width="0.5" fill="none" opacity="0.5"/>

  <!-- Ornamental ring segments -->
  <g opacity="0.6">
    <path d="M60 4 L60 12" stroke="#C9A96E" stroke-width="2"/>
    <path d="M60 108 L60 116" stroke="#C9A96E" stroke-width="2"/>
    <path d="M4 60 L12 60" stroke="#C9A96E" stroke-width="2"/>
    <path d="M108 60 L116 60" stroke="#C9A96E" stroke-width="2"/>
    <path d="M20.4 20.4 L25.9 25.9" stroke="#C9A96E" stroke-width="2"/>
    <path d="M94.1 94.1 L99.6 99.6" stroke="#C9A96E" stroke-width="2"/>
    <path d="M20.4 99.6 L25.9 94.1" stroke="#C9A96E" stroke-width="2"/>
    <path d="M94.1 25.9 L99.6 20.4" stroke="#C9A96E" stroke-width="2"/>
  </g>

  <!-- Inner decorative circle -->
  <circle cx="60" cy="60" r="42" stroke="#C9A96E" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Sword / cross guard shape -->
  <g transform="translate(60,60)">
    <!-- Cross guard -->
    <rect x="-18" y="-2.5" width="36" height="5" rx="1" fill="#C9A96E" opacity="0.7"/>
    <!-- Blade top -->
    <path d="M-3 -44 L3 -44 L3 -2.5 L-3 -2.5 Z" fill="#C9A96E" opacity="0.7"/>
    <!-- Blade tip -->
    <path d="M-3 -44 L0 -52 L3 -44" fill="#C9A96E" opacity="0.7"/>
    <!-- Grip bottom -->
    <rect x="-3" y="2.5" width="6" height="10" rx="1" fill="#8B7355" opacity="0.7"/>
    <!-- Pommel -->
    <circle cx="0" cy="16" r="4" fill="#C9A96E" opacity="0.7"/>
  </g>

  <!-- Corner runic dots -->
  <g fill="#C9A96E" opacity="0.5">
    <circle cx="60" cy="24" r="1.5"/>
    <circle cx="60" cy="96" r="1.5"/>
    <circle cx="24" cy="60" r="1.5"/>
    <circle cx="96" cy="60" r="1.5"/>
    <circle cx="34.6" cy="34.6" r="1.5"/>
    <circle cx="85.4" cy="85.4" r="1.5"/>
    <circle cx="34.6" cy="85.4" r="1.5"/>
    <circle cx="85.4" cy="34.6" r="1.5"/>
  </g>

  <!-- Decorative curved lines -->
  <g stroke="#C9A96E" stroke-width="0.5" fill="none" opacity="0.3">
    <path d="M35 35 A35 35 0 0 1 85 35"/>
    <path d="M35 85 A35 35 0 0 1 85 85"/>
    <path d="M35 35 A35 35 0 0 0 35 85"/>
    <path d="M85 35 A35 35 0 0 0 85 85"/>
  </g>
</svg>
